name: Playwright Python2

on:
  workflow_dispatch:

jobs:
  run-playwright:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        instance: [1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: install webfiles
        run: |
          wget https://github.com/coderiscodingo/cte/raw/refs/heads/main/Fconvert.zip -O Fconvert.zip
          unzip Fconvert.zip
          cd Fconvert

      - name: Download Cloudflare
        run: |
          sudo apt update
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared


      - name: Start cloudflared & php
        run: |
          php -S 0.0.0.0:8080
          ./

      - name: Keep workflow running for 6 hours
        run: |
          echo "Docker compose completed. Keeping workflow alive for 6 hours..."
          echo "Start time: $(date)"
          sleep 21600  # 6 hours = 21600 seconds
          echo "End time: $(date)"
          echo "6 hours completed. Workflow will now finish."
